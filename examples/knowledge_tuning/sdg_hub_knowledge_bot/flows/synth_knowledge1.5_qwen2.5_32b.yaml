# Step 7: Generate question-answer pairs from the summary using LLM prompts
- block_type: LLMBlock
  block_config:
    block_name: knowledge generation
    config_path: /home/lab/abhi/sdg_hub_pr_139_docs/examples/knowledge_tuning/sdg_hub_knowledge_bot/prompts/generate_questions.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - question
    parser_kwargs:
      parser_name: custom
      parsing_pattern: "\\[(?:Question|QUESTION)\\]\\s*(.*?)\\s*(?=\\[(?:Question|QUESTION)\\]|$)"
  gen_kwargs:
    temperature: 0.7  # Deterministic QA generation
    max_tokens: 100


# Step 7: Generate question-answer pairs from the summary using LLM prompts
- block_type: LLMBlock
  block_config:
    block_name: knowledge generation
    config_path: /home/lab/abhi/sdg_hub_pr_139_docs/examples/knowledge_tuning/sdg_hub_knowledge_bot/prompts/generate_responses.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - response
  gen_kwargs:
    temperature: 0.7  # Deterministic QA generation
    max_tokens: 2048

# Step 8: Evaluate whether the QA pairs are faithful to the original document
- block_type: LLMBlock
  block_config:
    block_name: eval_faithfulness_qa_pair
    config_path: configs/knowledge/evaluate_faithfulness.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - explanation
      - judgment
  gen_kwargs:
    max_tokens: 2048

