# --------------------------------------------
# SDG Hub - Knowledge Tuning Flow
# --------------------------------------------
# This YAML defines a multi-stage pipeline for generating high-quality
# question-answer pairs from source documents. The pipeline employs multiple summary
# techniques and rigorous quality control to ensure factual accuracy and educational value.
#
# Pipeline Stages:
# 1. Multi-Format Summarization
#    - Detailed summaries (detailed_summary.yaml)
#      * Comprehensive coverage of key points
#      * Maintains source accuracy
#      * No new information added
#
#    - Atomic facts (atomic_facts.yaml)
#      * Breaks down complex information
#      * Simple, self-contained statements
#      * Clear and unambiguous language
#
#    - Extractive summaries (extractive_summary.yaml)
#      * Direct excerpts from source
#      * Preserves original content
#      * Complete key point coverage
#
# 2. Data Transformation
#    - Flattens multiple summary formats
#    - Preserves source document backup
#    - Standardizes column structure
#
# 3. QA Generation (generate_questions_responses.yaml)
#    - Domain-specific question formulation
#    - Multiple difficulty levels
#    - Educational value focus
#    - Self-contained questions
#
# 4. Multi-Stage Quality Control
#    - Faithfulness evaluation
#      * Verifies factual accuracy
#      * Checks source alignment
#      * Filters unfaithful pairs
#
#    - Relevancy assessment
#      * Ensures topic relevance
#      * Maintains focus
#      * Filters irrelevant content
#
#    - Question quality verification
#      * Evaluates clarity
#      * Checks answerability
#      * Ensures educational value
#
# Use Cases:
# - Training a LLM on a new document such that the model can answer questions about the document
# - Unlike simple_knowledge.yaml, this flow creates multiple augmentation of the original document to improve model's understanding of the document.
#
# Mermaid Diagram:
# ```mermaid
# graph TD
#     A[DuplicateColumns] --> B[gen_detailed_summary]
#     A --> C[gen_atomic_facts]
#     A --> D[gen_extractive_summary]
#     B --> E[FlattenColumnsBlock]
#     C --> E
#     D --> E
#     E --> F[RenameColumns]
#     F --> G[generate_QA_pairs]
#     G --> H[eval_faithfulness]
#     H --> I[filter_faithful]
#     I --> J[eval_relevancy]
#     J --> K[filter_relevant]
#     K --> L[eval_question_quality]
#     L --> M[filter_verified_questions]
# ```
# 🔧 HOW THIS YAML IS EXECUTED
# --------------------------------------------
# A typical usage pattern is:
#
# ```python
# from sdg_hub.flow import Flow
# from sdg_hub.pipeline import Pipeline
# from sdg_hub.sdg import SDG
#
# # Load the YAML flow file and convert to internal config
# flow_cfg = Flow(client).get_flow_from_file("configs/flows/generation/knowledge/synth_knowledge1.5.yaml")
#
# # Create the synthetic data generator from flow
# sdg = SDG([Pipeline(flow_cfg)], num_workers=4, batch_size=8, save_freq=100)
#
# # Run on input dataset and export results
# generated = sdg.generate(dataset, checkpoint_dir="checkpoints/")
# generated.to_json("outputs.json", orient="records", lines=True)
# ```
# Step 1: Duplicate the original 'document' column for backup
- block_type: DuplicateColumns
  block_config:
    block_name: duplicate_document_col
    columns_map:
      document: base_document

# Step 2: Generate a detailed summary of the document
- block_type: LLMBlock
  block_config:
    block_name: gen_detailed_summary
    config_path: /home/lab/abhi/sdg_hub_pr_139_docs/examples/knowledge_tuning/sdg_hub_knowledge_bot/prompts/detailed_summary.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - summary_detailed
  gen_kwargs:
    max_tokens: 4096
    temperature: 0.7
    seed: 8753
    n: 50
  
# Step 3: Extract atomic facts from the document
- block_type: LLMBlock
  block_config:
    block_name: gen_atomic_facts
    config_path: /home/lab/abhi/sdg_hub_pr_139_docs/examples/knowledge_tuning/sdg_hub_knowledge_bot/prompts/atomic_facts.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - summary_atomic_facts
  gen_kwargs:
    max_tokens: 4096
    temperature: 0.7

# Step 4: Generate extractive summary using direct excerpts
- block_type: LLMBlock
  block_config:
    block_name: gen_extractive_summary
    config_path: /home/lab/abhi/sdg_hub_pr_139_docs/examples/knowledge_tuning/sdg_hub_knowledge_bot/prompts/extractive_summary.yaml
    model_id: Qwen/Qwen2.5-32B-Instruct
    output_cols:
      - summary_extractive
  gen_kwargs:
    max_tokens: 4096
    temperature: 0.7

# Step 5: Flatten all summary types into a unified long-format dataset
- block_type: FlattenColumnsBlock
  block_config:
    block_name: flatten_summary_columns
    var_cols:
      - summary_detailed
      - summary_extractive
      - summary_atomic_facts
      - base_document
    value_name: summary
    var_name: dataset_type

# Step 6: Rename the current summary as the new document input
- block_type: RenameColumns
  block_config:
    block_name: rename_to_document_column
    columns_map:
      document: raw_document
      summary: document

