- role: system
  content: あなたはテキストを要約する専門家です。
- role: user
  content: |-
    提供された文書から、強化抽出的要約（Enhanced Extractive Summary）を作成してください。
    標準的な抽出的要約が重要な文を単に抜き出すだけであるのに対し、強化抽出的要約では、抽出した各セグメントに対して豊かな文脈情報と認知的分類を付加します。
    文書の各重要セクションについて、2〜4個の主要な抜粋を抽出して列挙してください。その後、各抜粋に注釈を付けてください。回答は次の構成に従ってください:
    ### 文章からの抜粋:
    [抜粋のリスト]

    ### 注釈:

    ### 抜粋 [番号]
    > "[原文からの直接引用]"

    **文脈マーカー**: [この抜粋が文書の物語／議論構造のどこに位置づくかの簡潔な説明]
    **関連性**: [Low, Medium, Medium-High, High, Very High のいずれかで評価し、主要テーマに対する重要性を簡潔に説明]
    **関係性**: [この抜粋が他の抜粋とどのようにつながるかを、抜粋番号、または文書内の概念を指定して説明]

    タスクを理解する助けとして、以下に例を示します:
    文書:
    2020年以降、パンデミックによりリモートワークは150%以上増加した。企業は生産性が安定している一方で、従業員満足度が向上したことを見出した。しかし、コミュニケーションのギャップやチームの結束に関する問題といった課題も生じた。企業は現在、柔軟性と協働のバランスを取るためにハイブリッドモデルを採用している。

    ### 文章からの抜粋:
    1. > "2020年以降、パンデミックによりリモートワークは150%以上増加した。"
    2. > "企業は生産性が安定している一方で、従業員満足度が向上したことを見出した。"
    3. > "しかし、コミュニケーションのギャップやチームの結束に関する問題といった課題も生じた。"
    4. > "企業は現在、柔軟性と協働のバランスを取るためにハイブリッドモデルを採用している。"

    ### 注釈:

    ### 抜粋 1
    > "2020年以降、パンデミックによりリモートワークは150%以上増加した。"

    * **文脈マーカー**: これは冒頭の事実提示であり、時間的文脈と、後に論じられる変化の引き金を提供している。
    * **関連性**: **Very High** – 主題を導入し、変革の規模を定量化することで、議論全体の基盤を与えている。
    * **関係性**: 働き方の変化の原因を確立し、抜粋2と3の評価、そして抜粋4の結果としての移行へと直接つながる。


    ### 抜粋 2
    > "企業は生産性が安定している一方で、従業員満足度が向上したことを見出した。"

    * **文脈マーカー**: リモートワークの増加に続いて配置され、この抜粋は企業が観察した主要な利点を要約している。
    * **関連性**: **High** – リモートワークが支持を得た理由、すなわち事業継続を実現し従業員の士気を高めた点を示している。
    * **関係性**: 抜粋3と組み合わさってリモートワークの結果をバランスよく提示し、抜粋4のハイブリッドモデル採用の動機の一部を説明する。

    ### 抜粋 3
    > "しかし、コミュニケーションのギャップやチームの結束に関する問題といった課題も生じた。"

    * **文脈マーカー**: 物語の転換点を示し、利点からリモートワークの複雑さへと焦点を移している。
    * **関連性**: **High** – 企業が直面した重要な欠点を導入することで、議論にニュアンスを加えている。
    * **関係性**: 抜粋2と対比を成し、抜粋4におけるハイブリッドという解決策の根拠を準備する。

    ### 抜粋 4
    > "企業は現在、柔軟性と協働のバランスを取るためにハイブリッドモデルを採用している。"

    * **文脈マーカー**: 結論的な洞察として、先の発見に対応して採用されつつある合意／戦略を提示している。
    * **関連性**: **Very High** – 文書の洞察を統合し、将来志向の解決策へとまとめ上げている。
    * **関係性**: 抜粋2と3で示された緊張関係を解消し、抜粋1の状況によって引き起こされた進化を表している。

    それでは、提供された文書から強化抽出的要約を作成してください。
    文書:
    {{document_outline}}
    {{document}}
