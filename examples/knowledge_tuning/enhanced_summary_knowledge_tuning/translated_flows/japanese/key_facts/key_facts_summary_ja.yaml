- role: system
  content: あなたはテキストから重要な事実を要約するエキスパートです。
- role: user
  content: |-
    {{domain}}に関する記事の以下の抜粋を、原子的事実に分解してください。
    以下の原則に従って、重要な事実を要約してください：
    1. テキストから原子的事実／重要事実を特定する。
    2. 複文を原子的事実に分解する。
    3. まず重要事実を列挙する。
    4. 次に、各事実について、読者がその事実が元のテキストとどう結びつくかを明確に理解できるよう、本文から十分な文脈を添えて提示する。
    5. 以下の例の形式に従う。

    タスクを理解するための例を示します：

    ### Passage
    リモートワークは、パンデミックの影響により2020年以降150%以上増加した。企業は、生産性が安定している一方で、従業員満足度が向上したことを見出した。しかし、コミュニケーションのギャップやチームの結束に関する問題といった課題も生じた。企業は現在、柔軟性と協働のバランスを取るためにハイブリッドモデルを採用している。

    ### Key Facts
    1. リモートワークは2020年以降150%以上増加した。
    2. この増加の原動力はパンデミックだった。
    3. 企業はリモートワーク中も生産性が安定していたと報告した。
    4. リモートワーク期間中に従業員満足度が向上した。
    5. リモートワークはコミュニケーション上の課題を生んだ。
    6. リモートワークはチームの結束を弱めた。
    7. 企業はハイブリッドモデルを採用している。
    8. ハイブリッドモデルは柔軟性と協働のバランスを取ることを目的としている。


    ### Key Facts With Context
    1. **リモートワークは2020年以降150%以上増加した。**
      → この事実はリモートワークの劇的な増加を定量化し、パンデミック後の明確なビフォー／アフター比較を示している。

    2. **この増加の原動力はパンデミックだった。**
      → 世界的危機という文脈の中に変化を位置づけ、職場変革が反応的に起きたことを強調している。

    3. **企業はリモートワーク中も生産性が安定していたと報告した。**
      → 当初の懸念にもかかわらず、企業はリモートワークが成果を損なわなかったと観察しており、その実行可能性を裏づけている。

    4. **リモートワーク期間中に従業員満足度が向上した。**
      → リモート環境下で士気やウェルビーイングが改善し、運用面のモデルに人間中心の利点を加えている。

    5. **リモートワークはコミュニケーション上の課題を生んだ。**
      → 新しいモデルが対人・組織内の対話に摩擦をもたらしたことを認めている。

    6. **リモートワークはチームの結束を弱めた。**
      → コミュニケーションにとどまらず、移行によってチームの結びつきや相乗効果が低下し、文化や協働に影響したことを示している。

    7. **企業はハイブリッドモデルを採用している。**
      → 企業は完全リモートや完全出社に固執せず、混合型の解決策へと進化している。

    8. **ハイブリッドモデルは柔軟性と協働のバランスを取ることを目的としている。**
      → ハイブリッドモデルの狙いは、（柔軟性、満足度）といった利点を維持しつつ、（孤立、誤解）といった欠点を緩和することにある。
    ### End

    それでは、あなたの番です。上の例と同様のスタイルに従い、{{domain}}に関する記事の以下の抜粋を原子的事実に分解してください。
    ### Passage
    {{document_outline}}
    {{document}}

    ### Key Facts
