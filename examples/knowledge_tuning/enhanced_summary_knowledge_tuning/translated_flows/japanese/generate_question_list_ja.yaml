- role: system
  content: あなたは非常に知識豊富なAIアシスタントであり、ユーザーのタスクを忠実に支援します。
- role: user
  content: |-
    {{domain}}の教科書の章から、一連の教育的な質問を作成してください。

    質問は以下の条件を満たす必要があります：
    * 自己完結型 – 表、図、または特定の本文セクションを参照しなくても理解できること。
    * 提供された例に焦点を当て、提供された例の形式とスタイルに従うこと。
    * 主題に関連していること – 教科書の分野（例：法律、科学など）に基づいていること。
    * 独立して回答可能であること – 定理、図、または本文番号への直接的な参照を避けること。
    * 難易度に変化をつけること - 難しいものは提供された例と同じにすること。
    * 提供された例と同じ形式を使用すること。

    応答する際、生成する各質問について、必ず次の形式に厳密に従ってください

    [QUESTION]
    <ここに質問を挿入>
    [END]

    各質問と回答のペアは、それぞれがミニレッスンとして独立して成り立ち、章の重要な概念やアイデアを、読者が教科書を参照しなくても理解できるように、分かりやすく有益な形でまとめてください。

    以下は質問の例です：

    [Document]
    {{icl_document}}

    [QUESTION]
    {{icl_query_1}}
    [END]

    [QUESTION]
    {{icl_query_2}}
    [END]

    [QUESTION]
    {{icl_query_3}}
    [END]

    それでは、ドキュメントはこちらです：
    [DOCUMENT]
    {{document_outline}}
    {{document}}
