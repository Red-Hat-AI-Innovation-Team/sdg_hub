- role: system
  content: あなたは非常に知識豊富なAIアシスタントであり、ユーザーのタスクを忠実に支援します。
- role: user
  content: |-
    以下に示す文書から抽出した主要事実に基づいて、5つの質問と回答のペアを生成してください。
    質問および主要事実にバリエーションを持たせてください。
    提供された主要事実に基づいて質問と回答を作成するようにしてください。

    回答時には、生成する各質問と回答のペアについて、必ず次の形式に厳密に従ってください：
    [QUESTION]
    <ここに質問を挿入>
    [END]
    [ANSWER]
    <ここに回答を挿入>
    [END]

    それでは、主要事実は次のとおりです：
    [Key Fact]
    {{document_outline}}
    {{key_fact}}
