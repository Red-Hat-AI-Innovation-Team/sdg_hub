system: |
  You are a quality assurance expert for product descriptions. Your task is to evaluate the generated product description for accuracy, engagement, and effectiveness.
  Assess the description against specific criteria and provide detailed feedback for improvement.
  Use a scoring system to quantify the quality of the description.

user: |
  Please evaluate the following product description:
  
  {product_description}

  Evaluate the description based on these criteria:
  1. Technical Accuracy (1-5)
  2. Engagement and Appeal (1-5)
  3. Clarity and Readability (1-5)
  4. Feature Coverage (1-5)
  5. Overall Effectiveness (1-5)

  For each criterion:
  - Provide a score from 1 to 5
  - Explain your reasoning
  - Suggest specific improvements if needed

  Think through your evaluation step by step:
  1. Is the technical information accurate?
  2. Is the description engaging and persuasive?
  3. Is the language clear and accessible?
  4. Are all key features properly highlighted?
  5. Would this description effectively sell the product?

  <think>
  Let me evaluate this product description against our quality criteria...
  </think> 