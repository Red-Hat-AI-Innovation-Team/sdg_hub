    prompt_config_path: prompts/prompt_answer_translate.yaml
    format_as_messages: true
- block_type: "LLMChatBlock"
  block_config:
    block_name: "generate_answer_translation"
    input_cols: 
    - translated_answer_prompt
    output_cols:
    - translated_answer
    max_tokens: 4000
    temperature: 0.8
    async_mode: false


## Is Answer Translation Accuract?
- block_type: PromptBuilderBlock
  block_config:
    block_name: build_answer_translation_accurate
    input_cols:
    - answer
    - translated_answer
    output_cols:
    - answer_translation_accurate_prompt
    prompt_config_path: prompts/prompt_answer_translation_accurate.yaml
    format_as_messages: true
- block_type: "LLMChatBlock"
  block_config:
    block_name: "generate_answer_translation_accurate"
    input_cols: 
    - answer_translation_accurate_prompt
    output_cols:
    - answer_translation_accurate
    max_tokens: 4000
    temperature: 0.8
    async_mode: false
# Text Parser Block
- block_type: "TextParserBlock"
  block_config:
    block_name: "extract_answer_translation_accurate"
    input_cols: answer_translation_accurate
    output_cols:
    - answer_translation_accurate_explanation
    - answer_translation_accurate_score
    start_tags: ["[Start of Explanation]", "[Start of Label]"]
    end_tags: ["[End of Explanation]", "[End of Label]"]
# Filter Irrelevant Scenarios
