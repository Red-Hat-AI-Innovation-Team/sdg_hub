    [Start of Question]Why do researchers believe Micavibrio aeruginosavorus could be used as a "living antibiotic" in medicine?[End of Question]
    [Start of Answer]Researchers think Micavibrio aeruginosavorus could be used as a “living antibiotic” because it hunts and kills harmful bacteria. It can destroy bacteria that cause diseases and can even break down strong biofilms that normal antibiotics can’t easily remove. This makes it useful for fighting drug-resistant germs.[End of Answer]
