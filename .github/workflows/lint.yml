# SPDX-License-Identifier: Apache-2.0

name: Lint

on:
  push:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
      - '.claude/**'
      - '.claude-plugin/**'
      - '.harness-eval-baseline.json'
  pull_request:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
      - '.claude/**'
      - '.claude-plugin/**'
      - '.harness-eval-baseline.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: en_US.UTF-8
  RUFF_VERSION: "0.15.0"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Run Ruff format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check src/ tests/

      - name: Run Ruff linter
        run: uvx ruff@${{ env.RUFF_VERSION }} check src/ tests/

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run mypy type checker
        run: uv run mypy src/sdg_hub --show-error-codes

  harness-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install harness-eval
        run: pip install -q "harness-eval==7.9.1"

      - name: Run harness-eval lint
        run: harness-eval harness-lint . --preset recommended --fail-on-error --baseline .harness-eval-baseline.json
