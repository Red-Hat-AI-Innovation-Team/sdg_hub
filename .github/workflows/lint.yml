# SPDX-License-Identifier: Apache-2.0

name: Lint

on:
  push:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tox.ini'
      - 'scripts/ruff.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tox.ini'
      - 'scripts/ruff.sh'
      - '.github/workflows/lint.yml'

env:
  LC_ALL: en_US.UTF-8
  PYTHON_VERSION: "3.11"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: "0.10.1"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install tox with tox-uv
        run: uv tool install tox --with tox-uv

      - name: Run Ruff check
        run: tox -e ruff -- check

      - name: Prune uv cache
        run: uv cache prune --ci
