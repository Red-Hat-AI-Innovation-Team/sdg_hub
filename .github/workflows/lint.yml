# SPDX-License-Identifier: Apache-2.0

name: Lint, Format, and MyPy

on:
  push:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tox.ini'
      - 'scripts/*.sh'
      - '.github/**'
  pull_request:
    branches:
      - "main"
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tox.ini'
      - 'scripts/*.sh'
      - '.github/**'

env:
  PYTHON_VERSION: 3.11

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # https://github.com/actions/checkout/issues/249
          fetch-depth: 0
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          version: "0.10.1"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install tox with tox-uv
        id: deps
        run: |
          uv tool install tox --with tox-uv

      - name: Run Ruff check
        run: |
          tox -e ruff -- check

      # Pylint disabled for now - may re-enable as non-blocking check in future
      # - name: Run linting
      #   if: ${{ !cancelled() && (steps.deps.outcome == 'success') }}
      #   run: |
      #     echo "::add-matcher::.github/workflows/matchers/pylint.json"
      #     tox -e lint

      # MyPy type checking disabled for now - may re-enable as non-blocking check in future
      # - name: Run mypy type checks
      #   if: ${{ !cancelled() && (steps.deps.outcome == 'success') }}
      #   run: |
      #     tox -e mypy

      - name: Prune uv cache
        run: uv cache prune --ci
