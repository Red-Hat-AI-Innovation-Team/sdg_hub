# SPDX-License-Identifier: Apache-2.0

name: Knowledge Base Validation

on:
  push:
    branches: [main]
    paths: ['docs/agent-knowledge/**']
  pull_request:
    branches: [main]
    paths: ['docs/agent-knowledge/**']

permissions:
  contents: read

jobs:
  validate-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check all cross-links resolve
        run: |
          errors=0
          for file in docs/agent-knowledge/*.md; do
            while IFS= read -r link; do
              dir=$(dirname "$file")
              if [ ! -f "$dir/$link" ] && [ ! -f "$link" ]; then
                echo "::error file=$file::Broken link: $link"
                errors=$((errors + 1))
              fi
            done < <(grep -oP '\[.*?\]\(\K[^)]+\.md' "$file" 2>/dev/null)
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken link(s)"
            exit 1
          fi

      - name: Check index.md lists all knowledge base files
        run: |
          for file in docs/agent-knowledge/*.md; do
            base=$(basename "$file")
            if [ "$base" != "index.md" ]; then
              if ! grep -q "$base" docs/agent-knowledge/index.md; then
                echo "::warning file=docs/agent-knowledge/index.md::$base not listed in index"
              fi
            fi
          done
