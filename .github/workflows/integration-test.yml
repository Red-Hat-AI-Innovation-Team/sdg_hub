# SPDX-License-Identifier: Apache-2.0

name: Integration Test

# Integration tests require manual approval via label
# To run integration tests on a PR:
# 1. Review the PR code carefully
# 2. Add the "run-integration-tests" label to the PR
# 3. Tests will trigger automatically once label is added
#
# Note: Only maintainers/collaborators of can add labels (security gate)
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    branches:
      - "main"
      - "release-**"

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Check if this is a fork PR with the label - explain why tests can't run
  check-fork-pr:
    name: "Check Fork PR"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-integration-tests') &&
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Explain fork PR limitation
        run: |
          echo "⚠️ Cannot run integration tests on fork PRs for security reasons"
          echo ""
          echo "Fork PRs cannot access repository secrets (OPENAI_API_KEY) to prevent"
          echo "malicious code from exfiltrating credentials."
          echo ""
          echo "To run integration tests on this PR:"
          echo "1. Create a branch in the main repository from this fork"
          echo "2. Add the 'run-integration-tests' label to trigger tests"
          echo ""
          echo "Alternatively, tests will run automatically after merge to main."
          exit 1

  integration-test:
    name: "Integration Tests - ${{ matrix.python }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    # Only run if:
    # 1. Manual workflow_dispatch trigger, OR
    # 2. PR has "run-integration-tests" label AND is from main repo (not fork)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-integration-tests') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        python:
          - "3.11"
        platform:
          - "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # https://github.com/actions/checkout/issues/249
          fetch-depth: 0

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install the expect package
        run: |
          sudo apt-get install -y expect

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements*.txt

      - name: Remove llama-cpp-python from cache
        run: |
          pip cache remove llama_cpp_python

      - name: Cache huggingface datasets
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huggingface
          # Invalidate cache when any example notebook changes (may affect dataset downloads)
          key: huggingface-${{ hashFiles('examples/**/*.ipynb') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh>=1.2

      - name: Run integration tests with tox
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          tox -e py3-integrationcov

      - name: Remove llama-cpp-python from cache
        if: always()
        run: |
          pip cache remove llama_cpp_python

      - name: Upload integration test coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage-py3-integrationcov.xml
          fail_ci_if_error: false
          flags: integration

      - name: Upload integration test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ matrix.python }}-${{ matrix.platform }}
          path: |
            coverage-py3-integrationcov/
            coverage-py3-integrationcov.xml
            durations/py3-integrationcov.html
          retention-days: 30

  integration-test-workflow-complete:
    needs: ["integration-test"]
    runs-on: ubuntu-latest
    steps:
      - name: Integration Test Workflow Complete
        run: echo "Integration Test Workflow Complete"