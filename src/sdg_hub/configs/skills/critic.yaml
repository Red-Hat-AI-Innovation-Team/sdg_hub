# This YAML file defines a prompt template for evaluating AI responses
# based on domain-specific rubrics. The prompt is designed to provide
# structured, expert-level critiques that assess response quality
# against predefined criteria.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for response evaluation
# - principles: Guidelines for rubric-based evaluation
# - examples: Example of complete evaluation workflow
# - generation: Template for processing new query-response pairs
# - start_tags/end_tags: Delimiters for critique section
#
# Key Features:
# - Domain expert perspective
# - Rubric-based evaluation
# - Structured feedback
# - Criteria-specific assessment
# - Improvement suggestions
#
# Evaluation Guidelines:
# - Adopt domain expertise
# - Follow rubric strictly
# - Assess each criterion
# - Provide specific feedback
# - Focus on improvements
# - No additional criteria
#
# Input Sections:
# - Query: Original user question
# - Response: Model response to evaluate
# - Analysis: Domain and task context
# - Rubric: Evaluation criteria
#
# Response Format:
# - Structured critique
# - Criterion-by-criterion
# - Specific feedback
# - Improvement suggestions
# - Tag-delimited output
#
# Usage:
# This prompt is used to generate expert-level critiques of AI responses
# based on domain-specific rubrics, ensuring thorough evaluation and
# actionable feedback for improvement.

system: | 
  You are a very knowledgeable AI Assistant that will faithfully assist the user with their task.

introduction: | 
  You will assume the role of a critic. You will be given an analysis of a query which includes a rubric, and a response to the query generated by an AI assistant. Your task is to evaluate the response based on the rubric provided. 

principles: |
  Use the following step-by-step process to evaluate the response:
    * Using the domain as a part of the analysis, assume the role of an expert in that domain.
    * Understand the task description provided in the analysis.
    * Using the Rubric provided, evaluate the response generated by the AI assistant.
    * For each item in the rubric, your evaluation should include how well the response meets the criteria and any feedback for improvement.
    * Only evaluate the response based on the rubric provided, do not create your own criteria.

examples: |
  To help you understand the task, here is an example: 

  [Start of Query]
  {{ icl_query }}
  [End of Query]

  [Start of Response]
  {{ icl_response }}
  [End of Response]

  [Start of Analysis]
  {{ icl_analysis }}
  [End of Analysis]

  [Start of Rubric]
  {{ icl_rubric }}
  [End of Rubric]

  [Start of Critique]
  {{ icl_critique }}
  [End of Critique]

generation: |
  Now it's your turn to analyze the following query. 

  [Start of Query]
  {{ question }}
  [End of Query]

  [Start of Response]
  {{ response }}
  [End of Response]

  [Start of Analysis]
  {{ analysis }}
  [End of Analysis]

  [Start of Rubric]
  {{ rubric }}
  [End of Rubric]

  Remember to follow the paradigm and return the critique based on the rubric provided, between [Start of Critique] and [End of Critique] tags.

start_tags: ["[Start of Critique]"]
end_tags: ["[End of Critique]"]