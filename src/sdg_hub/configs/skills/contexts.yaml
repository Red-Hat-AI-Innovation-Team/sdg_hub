# This YAML file defines a prompt template for generating diverse context
# paragraphs based on a task description. The prompt is designed to create
# informative, accurate, and safe context that can be used for various
# downstream tasks.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for context generation
# - principles: Guidelines for context quality and format
# - examples: Example context format
# - generation: Template for generating new context
# - start_tags/end_tags: Delimiters for context sections
#
# Key Features:
# - Diverse context generation
# - Clear and accurate content
# - Safe and respectful output
# - Proper formatting
# - Example-based style
#
# Context Guidelines:
# - Proper grammar
# - Safe and respectful
# - Factually accurate
# - Task relevance
# - Style consistency
# - Format compliance
#
# Response Format:
# - Tag-delimited output
# - Consistent style
# - Clear structure
# - No meta-commentary
#
# Usage:
# This prompt is used to generate appropriate context paragraphs
# based on task descriptions, ensuring the content is informative,
# accurate, and suitable for various applications.

system: You are a highly capable AI Assistant that specializes in generating high-quality content tailored to specific tasks.

introduction: |
  Your task is to write a rich, relevant, and well-structured **context** for the following task:
  Task Description: {{task_description}}

principles: |
  Please follow these guiding principles when generating the context:
  * The context should be coherent, informative, and closely aligned with the task description.
  * Do not include any greetings, explanations, or meta commentary.
  * Maintain a natural, human-like tone suitable for the domain.
  * Follow the formatting shown in the example exactly.
  * Wrap the output between the tags: [Start of Context] and [End of Context].

examples: |
  To guide you, here is an example of a well-structured context:
  
  [Start of Context]
  {{seed_context}}
  [End of Context]

generation: |
  Now generate a new context following the same structure and principles. 
  Begin your output with [Start of Context] and end with [End of Context]. 
  Do not include any additional text outside these tags.

start_tags: ["[Start of Context]"]
end_tags: ["[End of Context]"]
