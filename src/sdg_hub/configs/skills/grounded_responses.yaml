# This YAML file defines a prompt template for generating grounded responses
# based on provided context and questions. The prompt is designed to create
# clear, accurate, and contextually relevant responses that use only the
# information from the given context.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for response generation
# - principles: Guidelines for response quality and context grounding
# - examples: Example context-question-response triples
# - generation: Template for generating new responses
# - start_tags/end_tags: Delimiters for response sections
#
# Key Features:
# - Context-based responses
# - Clear and accurate content
# - Safe and respectful output
# - Proper formatting
# - Example-based style
#
# Response Guidelines:
# - Proper grammar
# - Safe and respectful
# - Factually accurate
# - Context grounding
# - Prompt adherence
# - Style consistency
#
# Example Handling:
# - Single example support
# - Multiple sample support
# - Consistent formatting
# - Style preservation
#
# Context Requirements:
# - Responses must use context
# - No external knowledge
# - Clear information use
# - Relevant details
#
# Response Format:
# - Tag-delimited output
# - Consistent style
# - Clear structure
# - No meta-commentary
#
# Usage:
# This prompt is used to generate appropriate responses to questions
# based on provided context, ensuring responses are grounded in the
# given information while maintaining clarity and accuracy.

system: You are a very knowledgeable AI Assistant that will faithfully assist the user with their task.

introduction: Your task is to faithfully follow the user's prompt, given context and generate a response. 
principles: |
  Please follow these guiding principles when generating responses:
  * Use proper grammar and punctuation.
  * Always generate safe and respectful content. Do not generate content that is harmful, abusive, or offensive.
  * Always generate content that is factually accurate and relevant to the prompt.
  * Strictly adhere to the prompt and generate responses in the same style and format as the example.
  * Most importantly all the responses should be grounded in the context provided.
  * Return the response between [Start of Response] and [End of Response] tags.

examples: |
  To better assist you with this task, here are some examples:
  {% if seed_samples is defined %}
  {% for sample in seed_samples %}
  [Start of Context]
  {{ sample.seed_context }}
  [End of Context]

  [Start of Question]
  {{ sample.seed_question }}
  [End of Question]

  [Start of Response]
  {{ sample.seed_response }}
  [End of Response]
  {% endfor %}
  {% else %}
  [Start of Context]
  {{ seed_context }}
  [End of Context]

  [Start of Question]
  {{ seed_question }}
  [End of Question]

  [Start of Response]
  {{ seed_response }}
  [End of Response]
  {% endif %}

generation: |
  Now generate a response to the following prompt. Remember to use the same style and format as the example above. 
  Return the response between [Start of Response] and [End of Response] tags.

  [Start of Context]
  {{ context }}
  [End of Context]

  [Start of Question]
  {{ question }}
  [End of Question]

  Return the response between [Start of Response] and [End of Response] tags.


start_tags: ["[Start of Response]"]
end_tags: ["[End of Response]"]