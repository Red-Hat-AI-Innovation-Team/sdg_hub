# This YAML file defines a prompt template for generating improvement plans
# based on critiques of AI responses. The prompt is designed to create
# actionable, domain-specific plans that address identified issues and
# meet rubric criteria.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for plan generation
# - principles: Guidelines for creating actionable plans
# - examples: Example of complete planning workflow
# - generation: Template for processing new query-response pairs
# - start_tags/end_tags: Delimiters for plan section
#
# Key Features:
# - Domain-specific planning
# - Rubric-based improvements
# - Step-by-step action items
# - Critique integration
# - Actionable recommendations
#
# Planning Guidelines:
# - Use domain knowledge
# - Follow rubric criteria
# - Address critique points
# - Create specific steps
# - Ensure feasibility
# - Focus on actions only
#
# Input Sections:
# - Query: Original user question
# - Response: Initial model response
# - Analysis: Response evaluation
# - Rubric: Quality criteria
# - Critique: Detailed feedback
#
# Response Format:
# - Structured plan only
# - Step-by-step format
# - Clear action items
# - No implementation
# - Tag-delimited output
#
# Usage:
# This prompt is used to generate actionable improvement plans based on
# critiques of AI responses, ensuring that the plans are specific,
# feasible, and aligned with domain-specific requirements.

system: |
  You are a very knowledgeable AI Assistant that will faithfully assist the user with their task.

introduction: |
  Assume the role of an expert planner. You will be given a query and a base response generated by an AI assistant. Your task is to generate a response that provides a critique of the base response. 
  You will also be given an analysis, rubric and critique from a critic model. Your task is to generate a plan and actions to improve the base response based on the critique provided.

principles: |
  * You will utilize the identified domain, rubric and the evaluation of the model response to generate a plan to improve the response.
  * The plan should be step-by-step and should satisfy each criteria of the rubric.
  * The plan should not be generic and should be specific to the model response and the domain-specific rubric and evaluation from the critique. 
  * The generated plan should be actionable and feasible.
  * Your task is to only generate a plan, do not try to implement the plan or provide a revised response.
  * Return the plan between [Start of Plan] and [End of Plan] tags.

examples: |
  To help you understand the task, here is an example:

  [Start of Query]
  {{ icl_query }}
  [End of Query]

  [Start of Response]
  {{ icl_response }}
  [End of Response]

  [Start of Analysis]
  {{ icl_analysis }}
  [End of Analysis]

  [Start of Rubric]
  {{ icl_rubric }}
  [End of Rubric]

  [Start of Critique]
  {{ icl_critique }}
  [End of Critique]

  [Start of Plan]
  {{ icl_plan }}
  [End of Plan]

generation: |
  Now it's your turn to improve the response to the following query. Remember to follow the paradigm and return the plan in the respective section in the same format as above.

  [Start of Query]
  {{ question }}
  [End of Query]

  [Start of Response]
  {{ response }}
  [End of Response]

  [Start of Analysis]
  {{ analysis }}
  [End of Analysis]

  [Start of Rubric]
  {{ rubric }}
  [End of Rubric]

  [Start of Critique]
  {{ critique }}
  [End of Critique]

start_tags: ["[Start of Plan]"]
end_tags: ["[End of Plan]"]