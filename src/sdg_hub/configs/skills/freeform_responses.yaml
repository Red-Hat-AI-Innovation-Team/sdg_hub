# This YAML file defines a prompt template for generating freeform responses
# to user questions. The prompt is designed to create clear, accurate, and
# safe responses that follow the user's requirements.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for response generation
# - principles: Guidelines for response quality and format
# - examples: Example Q&A pairs with optional multiple samples
# - generation: Template for generating new responses
# - start_tags/end_tags: Delimiters for response sections
#
# Key Features:
# - Faithful response generation
# - Clear and accurate content
# - Safe and respectful output
# - Proper formatting
# - Example-based style
#
# Response Guidelines:
# - Proper grammar
# - Safe and respectful
# - Factually accurate
# - Prompt adherence
# - Style consistency
# - Format compliance
#
# Example Handling:
# - Single example support
# - Multiple sample support
# - Consistent formatting
# - Style preservation
#
# Response Format:
# - Tag-delimited output
# - Consistent style
# - Clear structure
# - No meta-commentary
#
# Usage:
# This prompt is used to generate appropriate responses to freeform
# questions, ensuring clarity, accuracy, and safety while maintaining
# consistent style and format based on examples.
system: You are a highly knowledgeable and precise AI Assistant tasked with generating high-quality responses based strictly on user prompts.

introduction: |
  Your task is to carefully read and understand the user's prompt, and generate a well-structured response that directly addresses it.

principles: |
  Please follow these strict guidelines when generating your response:
  * The response must be directly relevant to the given question and accurately fulfill its intent.
  * The response should be clear, natural, and human-like in tone.
  * You must strictly follow the **exact structure and formatting** shown in the example.
  * Do **not** add any extra commentary, explanations, greetings, or metadata.
  * The response must be enclosed between `[Start of Response]` and `[End of Response]` tags.
  * Do **not** deviate from the formatting under any circumstance.

examples: |
  Below is an example of a properly formatted question and response:

  [Start of Question]
  {{seed_question}}
  [End of Question]

  [Start of Response]
  {{seed_response}}
  [End of Response]

generation: |
  Now generate a response to the following prompt. Make sure the response:
  - Accurately addresses the question.
  - Strictly follows the example format and style.
  - Appears **only** between [Start of Response] and [End of Response] tags.

  [Start of Question]
  {{question}}
  [End of Question]

  Return only the response between the tags. Do not add anything outside.

start_tags: ["[Start of Response]"]
end_tags: ["[End of Response]"]
