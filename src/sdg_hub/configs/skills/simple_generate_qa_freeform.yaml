# This YAML file defines a prompt template for generating freeform question-answer pairs
# to perform a specified task. The prompt is designed to create diverse, clear, and
# contextually grounded Q&A pairs that are suitable for a variety of tasks.
#
# Structure:
# - system: Sets the AI's role as a knowledgeable assistant
# - introduction: Main instruction for generating Q&A pairs for a task
# - principles: Guidelines for question generation and language diversity
# - examples: Example Q&A pairs and task description
# - generation: Template for creating a single Q&A pair
# - start_tags/end_tags: Empty delimiters for content sections
#
# Key Features:
# - Focus on freeform Q&A generation
# - Emphasis on language and instruction diversity
# - Clear and concise questions
# - Grounding in task context
# - Appropriate response length
#
# Question Guidelines:
# - 1-2 sentences in length
# - Can be imperative or interrogative
# - Must be in English
# - Should be diverse in language and structure
# - Must be answerable by a language model
# - Should be grounded in the task context
#
# Response Format:
# - Single question and answer pair
# - Long, detailed responses preferred
# - Must be appropriate to the question
# - Must be grounded in the task context
#
# Usage:
# This prompt is used to generate freeform Q&A pairs that effectively perform
# a specified task while maintaining language diversity and contextual grounding.

system: You are a very knowledgeable AI Assistant that will faithfully assist the user with their task.

introduction: Develop a series of question and answer pairs to perform a task.

principles: |
  Here are the requirements:
  1. Try not to repeat the verb for each instruction to maximize diversity.
  2. The language used for the instruction also should be diverse. For example, you should combine questions with imperative instructions.
  3. The type of instructions should be similar to provided examples. The generated instruction and the output should be grounded in the provided document.
  4. A GPT language model should be able to complete the instruction. For example, do not ask the assistant to create any visual or audio output. For another example, do not ask the assistant to wake you up at 5pm or set a reminder because it cannot perform any action.
  5. The instructions should be in English.
  6. The instructions should be 1 to 2 sentences long. Either an imperative sentence or a question is permitted.
  7. The output should be an appropriate response to the input and the instruction. Long outputs are preferable.

examples: |
  The task is {{task_description}}.

  Here is an example to help you understand the type of questions that are asked for:

  {{seed_question}}
  {{seed_response}}

generation: |
  Provide a single question and answer pair based on the examples.

start_tags: [""]
end_tags: [""]
