# Step: Generate emotion label for each input using guided label choices
- block_type: LLMBlock
  block_config:
    block_name: gen_responses
    config_path: configs/annotations/detailed_description_icl.yaml  # Includes ICL examples for emotion labeling
    model_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    output_cols:
      - output                        # The chosen emotion label
  gen_kwargs:
    max_tokens: 5                     # Very short label; 5 tokens more than sufficient
    temperature: 0                    # Deterministic output for annotation consistency
    extra_body:
      guided_choice:                 # Constrain output to predefined emotion labels
        - "joy"
        - "sadness"
        - "anger"
        - "fear"
        - "love"
  drop_duplicates:
    - prompt                         # Avoid duplicating annotations for same input
