# --------------------------------------------
# SDG Hub - Emotion Annotation via Guided Choice
# --------------------------------------------
# This YAML flow defines a single-step generation block for annotating text
# (e.g., descriptions, narratives, prompts) with one of several emotion categories.
#
# The prompt used (from `detailed_description_icl.yaml`) contains in-context
# examples and uses **guided choice** to constrain the model's output to a
# fixed set of emotional labels.
#
# This flow is ideal for:
# - Weak supervision or annotation of emotional labels
# - Fine-tuning emotion classifiers or sentiment models
# - Producing gold/weak labels from an LLM in controlled conditions
#
# Mermaid Diagram:
# ```mermaid
# graph TD
#     A[gen_responses] --> B[drop_duplicates]
# ```
