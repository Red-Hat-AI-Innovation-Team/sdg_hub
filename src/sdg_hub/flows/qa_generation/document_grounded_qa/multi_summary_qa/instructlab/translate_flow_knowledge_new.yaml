metadata:
  name: "Translation Flow for Knowledge Tuning"
  description: "A comprehensive flow that translates documents and generates question-answer pairs in both source and target languages using translation and LLM blocks."
  version: "1.0.0"
  author: "SDG Hub Contributors"
  
  recommended_models:
    default: "ibm-granite/granite-3.3-2b-instruct"
    compatible: ["meta-llama/Llama-3.3-70B-Instruct", "microsoft/phi-4"]
    experimental: []
  
  tags:
    - "translation"
    - "question-generation"
    - "multilingual"
    - "knowledge-extraction"
    - "qa-pairs"
  
  license: "Apache-2.0"
  min_sdg_hub_version: "0.2.0"
  
  dataset_requirements:
    required_columns:
      - "title"
      - "text"
      - "domain"
      - "icl_document"
      - "icl_query"
      - "icl_response"
    description: "Input dataset should contain documents with title and text content in the source language, along with domain classification and in-context learning examples."

blocks:
  - block_type: TranslationBlock
    block_config:
      block_name: document_translation
      input_cols: [title, text]
      output_cols: [title_translated, text_translated]
      prompt_config_path: configs/translate_documents_new.yaml
      source_lang: "kan_Knda"  # Source language (Kannada)
      target_lang: "eng_Latn"  # Target language (English)
      trans_model_id: ai4bharat/indictrans2-indic-en-dist-200M
      client_url: "http://localhost:8000/v1"
      format_as_messages: false

  - block_type: PromptBuilderBlock
    block_config:
      block_name: question_generation_prompt
      input_cols: [domain, title_translated, text_translated, icl_document, icl_query]
      output_cols: question_generation_prompt
      prompt_config_path: configs/generate_question_new.yaml
      format_as_messages: true

  - block_type: LLMChatBlock
    block_config:
      block_name: question_generation
      input_cols: question_generation_prompt
      output_cols: raw_question
      model: "ibm-granite/granite-3.3-2b-instruct"
      max_tokens: 512
      temperature: 0.7
      async_mode: true

  - block_type: TextParserBlock
    block_config:
      block_name: parse_question
      input_cols: raw_question
      output_cols: question
      parsing_pattern: "(?:Question|QUESTION)\\:\\s*(.*)"
      parser_cleanup_tags: ["[END]", "[End]"]

  - block_type: PromptBuilderBlock
    block_config:
      block_name: response_generation_prompt
      input_cols: [domain, title_translated, text_translated, icl_document, icl_query, icl_response, question]
      output_cols: response_generation_prompt
      prompt_config_path: configs/generate_response_new.yaml
      format_as_messages: true

  - block_type: LLMChatBlock
    block_config:
      block_name: response_generation
      input_cols: response_generation_prompt
      output_cols: raw_response
      model: "ibm-granite/granite-3.3-2b-instruct"
      max_tokens: 512
      temperature: 0.7
      async_mode: true

  - block_type: TextParserBlock
    block_config:
      block_name: parse_response
      input_cols: raw_response
      output_cols: response
      parsing_pattern: "(?:Answer|ANSWER)\\:\\s*(.*)"
      parser_cleanup_tags: ["[END]", "[End]"]

  - block_type: TranslationBlock
    block_config:
      block_name: question_response_translation
      input_cols: [question, response]
      output_cols: [question_translated, response_translated]
      prompt_config_path: configs/translate_question_response_new.yaml
      source_lang: "eng_Latn"  # Source language (English)
      target_lang: "kan_Knda"  # Target language (Kannada)
      trans_model_id: ai4bharat/indictrans2-en-indic-dist-200M
      client_url: "http://localhost:8000/v1"
      format_as_messages: false
