- role: system
  content: A chat between a curious user and an artificial intelligence assistant. The assistant gives helpful, detailed, and polite answers to the questions.

- role: user
  content: |-
    {% if rephrase_level == "easy" %}
    For the following paragraph give me a paraphrase of the same using
    a very small vocabulary and extremely simple sentences that a toddler will
    understand:
    {% elif rephrase_level == "hard" %}
    For the following paragraph give me a paraphrase of the same using very
    terse and abstruse language that only an erudite scholar will understand.
    Replace simple words and phrases with rare and complex ones:
    {% else %}
    For the following paragraph give me a diverse paraphrase of the same
    in high quality English language as in sentences on Wikipedia:
    {% endif %}

    [Document]
    {{document_outline}}
    {{document}}