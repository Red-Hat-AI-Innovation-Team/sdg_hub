metadata:
  name: Document Rephrasing Flow
  description: Rephrases documents at different complexity levels (easy, medium, hard) using Jinja-templated prompts. Generates paraphrases suitable for different reading levels.
  version: 2.0.0
  author: SDG Hub Contributors
  recommended_models:
    default: openai/gpt-oss-120b
    compatible:
    - meta-llama/Llama-3.3-70B-Instruct
    - microsoft/phi-4
    - mistralai/Mixtral-8x7B-Instruct-v0.1
    experimental: []
  tags:
  - knowledge-tuning
  - document-internalization
  - paraphrasing
  - text-simplification
  license: Apache-2.0
  dataset_requirements:
    required_columns:
    - document
    - document_outline
    - rephrase_level
    description: 'Input dataset should contain documents with text content, outlines, and a rephrase_level column specifying "easy", "medium", or "hard" complexity for paraphrasing.'
  output_columns:
  - rephrased_document
  - raw_rephrase_output
  id: document-rephrasing-flow
blocks:
- block_type: PromptBuilderBlock
  block_config:
    block_name: rephrase_prompt
    input_cols:
    - document
    - document_outline
    - rephrase_level
    output_cols: rephrase_prompt
    prompt_config_path: prompt.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: gen_rephrased_document
    input_cols: rephrase_prompt
    output_cols: raw_rephrase_output
    max_tokens: 4096
    temperature: 0.7
    n: 1
    async_mode: true
- block_type: LLMParserBlock
  block_config:
    block_name: extract_rephrased_content
    input_cols: raw_rephrase_output
    output_cols: rephrased_document
    extract_content: true
    expand_lists: false
