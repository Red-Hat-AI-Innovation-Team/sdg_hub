metadata:
  name: Document Rephrasing Flow
  description: Rephrases documents at different complexity levels (easy, medium, hard) using Jinja-templated prompts based on Rephrasing the Web paper. Generates paraphrases suitable for different reading levels. The augmentation and the prompts are adopted from https://arxiv.org/abs/2401.16380
  version: 2.0.0
  author: SDG Hub Contributors
  recommended_models:
    default: openai/gpt-oss-120b
    compatible:
    - meta-llama/Llama-3.3-70B-Instruct
    - microsoft/phi-4
    - mistralai/Mixtral-8x7B-Instruct-v0.1
    experimental: []
  tags:
  - knowledge-tuning
  - document-internalization
  - paraphrasing
  - text-simplification
  license: Apache-2.0
  dataset_requirements:
    required_columns:
    - document
    - document_outline
    - rephrase_level
    description: 'Input dataset should contain documents with text content, outlines, and a rephrase_level column specifying "easy", "medium", or "hard" complexity for paraphrasing.'
  output_columns:
  - rephrased_document
  - raw_rephrase_output
  id: document-rephrasing-flow
blocks:
- block_type: PromptBuilderBlock
  block_config:
    block_name: rephrase_prompt
    input_cols:
    - document
    - document_outline
    - rephrase_level
    output_cols: rephrase_prompt
    prompt_config_path: prompt.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: gen_rephrased_document
    input_cols: rephrase_prompt
    output_cols: raw_rephrase_output
    max_tokens: 4096
    temperature: 0.7
    n: 2
    async_mode: true
- block_type: LLMParserBlock
  block_config:
    block_name: extract_rephrased_content
    input_cols: raw_rephrase_output
    extract_content: true
    expand_lists: true
- block_type: RenameColumnsBlock
  block_config:
    block_name: rename_to_raw_document_column
    input_cols:
      document: raw_document
- block_type: RenameColumnsBlock
  block_config:
    block_name: rename_to_document_column
    input_cols:
      extract_rephrased_content_content: document
- block_type: PromptBuilderBlock
  block_config:
    block_name: question_generation_prompt
    input_cols:
    - domain
    - document
    - document_outline
    - icl_document
    - icl_query_1
    - icl_query_2
    - icl_query_3
    output_cols: question_generation_prompt
    prompt_config_path: ../generate_question_list.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: question_generation
    input_cols: question_generation_prompt
    output_cols: question_list
    max_tokens: 256
    temperature: 0.7
    n: 1
    async_mode: true
- block_type: LLMParserBlock
  block_config:
    block_name: extract_questions
    input_cols: question_list
    extract_content: true
    expand_lists: true
- block_type: TextParserBlock
  block_config:
    block_name: parse_question_list
    input_cols: extract_questions_content
    output_cols: question
    start_tags:
    - '[QUESTION]'
    end_tags:
    - '[END]'
- block_type: PromptBuilderBlock
  block_config:
    block_name: answer_generation_prompt
    input_cols:
    - question
    - document
    - document_outline
    output_cols: answer_generation_prompt
    prompt_config_path: ../generate_answers.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: answer_generation
    input_cols: answer_generation_prompt
    output_cols: response_dict
    max_tokens: 4096
    temperature: 0.7
    n: 1
    async_mode: true
- block_type: LLMParserBlock
  block_config:
    block_name: extract_answers
    input_cols: response_dict
    extract_content: true
    expand_lists: true
- block_type: TextParserBlock
  block_config:
    block_name: parse_response_dict
    input_cols: extract_answers_content
    output_cols: response
    start_tags:
    - ''
    end_tags:
    - ''
    save_reasoning_content: true
- block_type: PromptBuilderBlock
  block_config:
    block_name: eval_faithful_prompt
    input_cols:
    - document
    - response
    output_cols: eval_faithful_prompt
    prompt_config_path: ../../multi_summary_qa/instructlab/evaluate_faithfulness.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: eval_faithful_llm_chat
    input_cols: eval_faithful_prompt
    output_cols: eval_faithful_response_dict
    n: 1
    async_mode: true
- block_type: LLMParserBlock
  block_config:
    block_name: extract_eval_faithful
    input_cols: eval_faithful_response_dict
    extract_content: true
- block_type: TextParserBlock
  block_config:
    block_name: parse_eval_faithful
    input_cols: extract_eval_faithful_content
    output_cols: 
    - faithfulness_explanation
    - faithfulness_judgement
    start_tags:
    - '[Start of Explanation]'
    - '[Start of Answer]'
    end_tags:
    - '[End of Explanation]'
    - '[End of Answer]'
- block_type: ColumnValueFilterBlock
  block_config:
    block_name: eval_faithful_filter
    input_cols:
      - faithfulness_judgement
    filter_value: 'YES'
    operation: eq