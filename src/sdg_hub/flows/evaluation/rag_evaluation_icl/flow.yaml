metadata:
  name: RAG Evaluation ICL Dataset Flow
  description: Generates realistic Q&A pairs for RAG evaluation using In-Context Learning with example questions.
  version: 1.0.0
  author: Red Hat AI RAG Contributors
  license: Apache-2.0
  recommended_models:
    default: openai/gpt-oss-120b
    compatible:
    - meta-llama/Llama-3.3-70B-Instruct
    - microsoft/phi-4
  tags:
  - rag-evaluation
  - qa-pairs
  - icl
  dataset_requirements:
    required_columns:
    - document
    - document_outline
    - icl_document
    - icl_query_1
    - icl_query_2
    - icl_query_3
    description: 'Input dataset should contain documents with text content, document outlines, and in-context learning examples (an example document with three example questions) to guide realistic question generation style.

      '
  id: keen-pearl-546
blocks:
- block_type: DuplicateColumnsBlock
  block_config:
    block_name: duplicate_to_context
    input_cols:
      document: context
- block_type: PromptBuilderBlock
  block_config:
    block_name: icl_question_prompt
    input_cols:
    - document
    - document_outline
    - icl_document
    - icl_query_1
    - icl_query_2
    - icl_query_3
    output_cols: icl_question_messages
    prompt_config_path: prompts/icl_question_generation.yaml
    format_as_messages: true
- block_type: LLMChatBlock
  block_config:
    block_name: gen_icl_questions
    input_cols: icl_question_messages
    output_cols: icl_question_response
    async_mode: true
    n: 1
    max_tokens: 256
    temperature: 0.7
- block_type: LLMResponseExtractorBlock
  block_config:
    block_name: parse_icl_questions
    input_cols: icl_question_response
    field_prefix: icl_q_
    extract_content: true
- block_type: TagParserBlock
  block_config:
    block_name: parse_question_tags
    input_cols: icl_q_content
    output_cols: question
    start_tags:
    - '[QUESTION]'
    end_tags:
    - '[END]'
- block_type: PromptBuilderBlock
  block_config:
    block_name: answer_prompt
    input_cols:
      context: context
      question: question
    output_cols: answer_messages
    prompt_config_path: prompts/answer_generation.yaml
- block_type: LLMChatBlock
  block_config:
    block_name: gen_answer
    input_cols: answer_messages
    output_cols: answer_response
    async_mode: true
    n: 1
    max_tokens: 4096
    temperature: 0.2
- block_type: LLMResponseExtractorBlock
  block_config:
    block_name: parse_answer
    input_cols: answer_response
    field_prefix: answer_
    extract_content: true
- block_type: PromptBuilderBlock
  block_config:
    block_name: critic_prompt
    input_cols:
      context: context
      question: question
      answer_content: answer
    output_cols: critic_messages
    prompt_config_path: prompts/groundedness_critic.yaml
- block_type: LLMChatBlock
  block_config:
    block_name: gen_critic_score
    input_cols: critic_messages
    output_cols: critic_response
    async_mode: true
    n: 1
    max_tokens: 512
    temperature: 0.0
- block_type: LLMResponseExtractorBlock
  block_config:
    block_name: parse_critic_score
    input_cols: critic_response
    field_prefix: critic_
    extract_content: true
- block_type: ColumnValueFilterBlock
  block_config:
    block_name: filter_ungrounded
    input_cols: critic_content
    filter_value:
    - 4
    - 5
    operation: eq
    convert_dtype: int
- block_type: PromptBuilderBlock
  block_config:
    block_name: extraction_prompt
    input_cols:
      context: context
      question: question
      answer_content: answer
    output_cols: extraction_messages
    prompt_config_path: prompts/context_extraction.yaml
- block_type: LLMChatBlock
  block_config:
    block_name: extract_context
    input_cols: extraction_messages
    output_cols: extraction_response
    async_mode: true
    n: 1
    max_tokens: 4096
    temperature: 0.0
- block_type: LLMResponseExtractorBlock
  block_config:
    block_name: parse_extracted_context
    input_cols: extraction_response
    field_prefix: ground_truth_
    extract_content: true
- block_type: RenameColumnsBlock
  block_config:
    block_name: rename_final_columns
    input_cols:
      answer_content: response
      ground_truth_content: ground_truth_context
