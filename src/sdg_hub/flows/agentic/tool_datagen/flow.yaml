metadata:
  name: "Toucan Tool-Use Data Generation"
  description: >
    Generates high-quality tool-use training data from MCP tool collections
    using the Toucan pipeline (arxiv 2510.01179). The pipeline synthesizes
    realistic user questions from tool descriptions, filters for quality,
    generates agent execution trajectories, and validates response quality.
    See https://arxiv.org/abs/2510.01179 for more details.
  version: "1.0.0"
  author: "Xu et al. (2025) & SDG Hub Contributors"
  license: "Apache-2.0"
  recommended_models:
    default: "openai/gpt-5.2"
    compatible:
      - "openai/gpt-5-mini"
      - "hosted_vllm/openai/gpt-oss-120b"
    experimental: []
  tags:
    - agentic
    - tool-use
    - data-generation
    - mcp
  dataset_requirements:
    required_columns:
      - tool_list
      - mcp_server_name
      - mcp_server_description
    description: >
      Input dataset with MCP tool collections. Each row should contain:
      tool_list (Python list of tool objects with name, description, inputSchema),
      mcp_server_name (server name string, can be empty),
      mcp_server_description (server description string, can be empty).
  id: smart-pine-839

# =============================================================================
# Stage 1: Diversity - multiply rows and sample tool combinations
# =============================================================================
blocks:
  - block_type: RowMultiplierBlock
    block_config:
      block_name: multiply_tool_rows
      num_samples: 10
      shuffle: true

  - block_type: SamplerBlock
    block_config:
      block_name: sample_tools
      input_cols: [tool_list]
      output_cols: [sampled_tools]
      num_samples: 2

# =============================================================================
# Stage 2: Task Synthesis - generate realistic user questions from tools
# =============================================================================
  - block_type: PromptBuilderBlock
    block_config:
      block_name: build_question_gen_prompt
      input_cols:
        sampled_tools: tool_list
        mcp_server_name: mcp_server_name
        mcp_server_description: mcp_server_description
      output_cols: question_gen_messages
      prompt_config_path: prompts/question_generation.yaml

  - block_type: LLMChatBlock
    block_config:
      block_name: generate_questions
      input_cols: question_gen_messages
      output_cols: question_gen_response
      async_mode: true

  - block_type: LLMResponseExtractorBlock
    block_config:
      block_name: extract_question_response
      input_cols: question_gen_response
      field_prefix: "question_gen_"
      extract_content: true

  - block_type: TagParserBlock
    block_config:
      block_name: parse_question_fields
      input_cols: question_gen_content
      output_cols:
        - target_tools
        - question
      start_tags:
        - "<target_tools>"
        - "<question>"
      end_tags:
        - "</target_tools>"
        - "</question>"

# =============================================================================
# Stage 3: Quality Filtering - score and filter low-quality questions
# =============================================================================
  - block_type: PromptBuilderBlock
    block_config:
      block_name: build_quality_check_prompt
      input_cols:
        tool_list: all_server_and_tool_information
        question: question_content
        target_tools: intended_tool
      output_cols: quality_check_messages
      prompt_config_path: prompts/question_quality_check.yaml

  - block_type: LLMChatBlock
    block_config:
      block_name: score_question_quality
      input_cols: quality_check_messages
      output_cols: quality_check_response
      async_mode: true

  - block_type: LLMResponseExtractorBlock
    block_config:
      block_name: extract_quality_response
      input_cols: quality_check_response
      field_prefix: "quality_check_"
      extract_content: true

  - block_type: TagParserBlock
    block_config:
      block_name: parse_quality_score
      input_cols: quality_check_content
      output_cols:
        - question_quality_rating
      start_tags:
        - "<question_quality_rating>"
      end_tags:
        - "</question_quality_rating>"

  - block_type: ColumnValueFilterBlock
    block_config:
      block_name: filter_low_quality_questions
      input_cols:
        - question_quality_rating
      filter_value:
        - "good"
        - "excellent"
      operation: "eq"

# =============================================================================
# Stage 4: Trajectory Generation - execute questions through external agent
# =============================================================================
  - block_type: AgentBlock
    block_config:
      block_name: run_agent_trajectory
      agent_framework: langflow
      agent_url: "http://localhost:7860/api/v1/run/default"
      input_cols: [question]
      output_cols:
        - agent_response

  - block_type: AgentResponseExtractorBlock
    block_config:
      block_name: extract_agent_text
      agent_framework: langflow
      input_cols: agent_response
      extract_text: true
      extract_session_id: false

# =============================================================================
# Stage 5: Response Quality Validation - score and filter low-quality responses
# =============================================================================
  - block_type: PromptBuilderBlock
    block_config:
      block_name: build_response_quality_prompt
      input_cols:
        question: question_content
        target_tools: intended_tool
        extract_agent_text_text: conversation_history
      output_cols: response_quality_messages
      prompt_config_path: prompts/response_quality_check.yaml

  - block_type: LLMChatBlock
    block_config:
      block_name: score_response_quality
      input_cols: response_quality_messages
      output_cols: response_quality_response
      async_mode: true

  - block_type: LLMResponseExtractorBlock
    block_config:
      block_name: extract_response_quality
      input_cols: response_quality_response
      field_prefix: "response_quality_"
      extract_content: true

  - block_type: TagParserBlock
    block_config:
      block_name: parse_response_scores
      input_cols: response_quality_content
      output_cols:
        - completeness_rating
        - conciseness_rating
      start_tags:
        - "<completeness_rating>"
        - "<conciseness_rating>"
      end_tags:
        - "</completeness_rating>"
        - "</conciseness_rating>"

  - block_type: ColumnValueFilterBlock
    block_config:
      block_name: filter_incomplete_responses
      input_cols:
        - completeness_rating
      filter_value:
        - "mostly complete"
        - "fully complete"
      operation: "eq"

  - block_type: ColumnValueFilterBlock
    block_config:
      block_name: filter_verbose_responses
      input_cols:
        - conciseness_rating
      filter_value:
        - "concise"
        - "very concise"
      operation: "eq"
